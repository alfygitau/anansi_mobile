name: app_anansi_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.1
dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.2.1
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^10.0.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  dio: ^5.9.2
  device_info_plus: ^11.0.0
  provider: ^6.1.5+1
  shimmer: ^3.0.0
  file_picker: ^11.0.2
  flutter_launcher_icons: ^0.14.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#042159"
  remove_alpha_ios: true
